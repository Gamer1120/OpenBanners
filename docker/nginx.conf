server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /banner/ {
    try_files $uri $uri/ @banner_meta;
  }

  location /api/ {
    return 404;
  }

  location @banner_meta {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_hide_header X-Powered-By;
    fastcgi_param SCRIPT_FILENAME /usr/share/nginx/server/banner-meta.php;
    fastcgi_param SCRIPT_NAME /banner-meta.php;
    fastcgi_param ORIGINAL_REQUEST_URI $request_uri;
    fastcgi_param OPENBANNERS_INDEX_HTML /usr/share/nginx/html/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
