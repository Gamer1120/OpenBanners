# http-level part of docker/openbanners-security-headers.conf. On the VPS:
# /etc/nginx/conf.d/openbanners-security-headers-map.conf.
#
# The container already sends its own Referrer-Policy (no-referrer) and
# X-Content-Type-Options on some /_openbanners/ answers; keep those instead of
# adding a second, conflicting header (an empty add_header value adds nothing).
map $upstream_http_referrer_policy $openbanners_referrer_policy {
  "" "strict-origin-when-cross-origin";
  default "";
}

map $upstream_http_x_content_type_options $openbanners_nosniff {
  "" "nosniff";
  default "";
}
