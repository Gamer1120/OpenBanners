# Included in the openbanners.org vhost on the VPS. The browser security
# headers (CSP, HSTS, frame, referrer, permissions) are in
# docker/openbanners-security-headers.conf; see there.
location /api/ {
  include snippets/openbanners-security-headers.conf;
  return 404;
}

location / {
  include snippets/openbanners-security-headers.conf;

  proxy_pass http://127.0.0.1:18080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header Forwarded "proto=https;host=$host";
}
