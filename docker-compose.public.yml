name: openbanners-public

services:
  web:
    image: ghcr.io/gamer1120/openbanners:latest
    container_name: openbanners-public
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:18080:80"
    environment:
      OPENBANNERS_BANNER_TOGETHER_ENABLED: "1"
      OPENBANNERS_BANNER_TOGETHER_STORAGE: "/var/lib/openbanners/banner-together"
    volumes:
      - banner-together-data:/var/lib/openbanners/banner-together
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "openbanners-public"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: openbanners-watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--interval"
      - "300"
      - "--cleanup"
      - "--label-enable"
      - "--scope"
      - "openbanners-public"

volumes:
  banner-together-data:
    name: openbanners-banner-together-data
