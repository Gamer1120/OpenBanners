map $http_x_real_ip $banner_together_client_ip {
  "" $binary_remote_addr;
  default $http_x_real_ip;
}

limit_req_zone $banner_together_client_ip zone=banner_together_requests:10m rate=120r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /banner/ {
    try_files $uri $uri/ @banner_meta;
  }

  location ^~ /_openbanners/banner-together/v2/ {
    access_log off;
    client_max_body_size 1000k;
    limit_req zone=banner_together_requests burst=60 nodelay;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_hide_header X-Powered-By;
    fastcgi_request_buffering on;
    fastcgi_read_timeout 15s;
    fastcgi_param SCRIPT_FILENAME /usr/share/nginx/server/banner-together-api.php;
    fastcgi_param SCRIPT_NAME /banner-together-api.php;
    fastcgi_param ORIGINAL_REQUEST_URI $request_uri;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_IDEMPOTENCY_KEY $http_idempotency_key;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_SEC_FETCH_SITE $http_sec_fetch_site;
    fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
    fastcgi_param HTTP_PROXY "";
  }

  location ^~ /_openbanners/banner-together/ {
    return 404;
  }

  location /api/ {
    return 404;
  }

  location @banner_meta {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_hide_header X-Powered-By;
    fastcgi_param SCRIPT_FILENAME /usr/share/nginx/server/banner-meta.php;
    fastcgi_param SCRIPT_NAME /banner-meta.php;
    fastcgi_param ORIGINAL_REQUEST_URI $request_uri;
    fastcgi_param OPENBANNERS_INDEX_HTML /usr/share/nginx/html/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
