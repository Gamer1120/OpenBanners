<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBanners Bannergress Auth</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1014;
        color: #f4f7fb;
        font: 16px/1.5 system-ui, sans-serif;
      }

      main {
        box-sizing: border-box;
        width: min(480px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      p {
        margin: 0;
        color: rgba(244, 247, 251, 0.82);
      }

      .back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 22px;
        border-radius: 20px;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Finishing Bannergress sign-in…</h1>
      <p id="message">Please wait while OpenBanners stores your Bannergress session.</p>
      <!-- For when this tab can't close itself (no popup, a custom tab, an
           in-app browser): always a way back to the site. -->
      <a id="back" class="back" href="/">Back to OpenBanners</a>
    </main>
    <script src="/bannergress-auth-callback.js"></script>
  </body>
</html>
