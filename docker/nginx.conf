user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ~ ^/banner/[^/?#]+$ {
      try_files $uri $uri/index.html @banner_meta;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location @banner_meta {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/server/banner-meta.php;
      fastcgi_param SCRIPT_NAME /banner-meta.php;
      fastcgi_param REQUEST_URI $request_uri;
      fastcgi_param ORIGINAL_REQUEST_URI $request_uri;
      fastcgi_pass 127.0.0.1:9000;
    }
  }
}
