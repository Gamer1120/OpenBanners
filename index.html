<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#16161c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Find, plan and walk Ingress mission banners." />
    <meta property="og:site_name" content="OpenBanners" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenBanners" />
    <meta
      property="og:description"
      content="Find, plan and walk Ingress mission banners."
    />
    <meta property="og:url" content="https://openbanners.org/" />
    <!-- The site's card (DEFAULT_IMAGE in server/page-meta.mjs); banners and
         Mission Day plans get their own picture from server/banner-meta.mts. -->
    <meta property="og:image" content="https://openbanners.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenBanners: find, plan and walk Ingress mission banners" />
    <meta name="twitter:image" content="https://openbanners.org/og-image.png" />
    <meta name="twitter:image:alt" content="OpenBanners: find, plan and walk Ingress mission banners" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenBanners" />
    <meta
      name="twitter:description"
      content="Find, plan and walk Ingress mission banners."
    />
    <link rel="canonical" href="https://openbanners.org/" />
    <!-- The UI font (src/fonts.css), so text doesn't wait for the stylesheet. -->
    <link rel="preload" href="/src/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenBanners" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>OpenBanners</title>
    <script>
      // Dark only: forget the old light/system choice.
      try {
        localStorage.removeItem("openbanners-theme-mode");
      } catch (error) {}
    </script>
    <script>
      (function () {
        const origin = window.location.origin || "https://openbanners.org";
        const currentUrl = new URL(
          `${window.location.pathname}${window.location.search}`,
          origin
        ).toString();

        const ensureMeta = (attribute, name) => {
          let element = document.head.querySelector(
            `meta[${attribute}="${name}"]`
          );

          if (!element) {
            element = document.createElement("meta");
            element.setAttribute(attribute, name);
            document.head.appendChild(element);
          }

          return element;
        };

        const setMeta = (attribute, name, content) => {
          ensureMeta(attribute, name).setAttribute("content", content);
        };

        let canonicalLink = document.head.querySelector('link[rel="canonical"]');
        if (!canonicalLink) {
          canonicalLink = document.createElement("link");
          canonicalLink.setAttribute("rel", "canonical");
          document.head.appendChild(canonicalLink);
        }
        canonicalLink.setAttribute("href", currentUrl);
        setMeta("property", "og:url", currentUrl);

        // Banner pages: the meta service (server/banner-meta.mts) already puts
        // the banner's tags in this HTML and the app sets them after loading
        // the banner, so there is no second Bannergress request here.
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
