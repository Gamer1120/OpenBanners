map $http_x_real_ip $banner_together_client_ip {
  "" $binary_remote_addr;
  default $http_x_real_ip;
}

map $http_x_forwarded_proto $openbanners_forwarded_proto {
  "http" http;
  "https" https;
  default $scheme;
}

limit_req_zone $banner_together_client_ip zone=banner_together_requests:10m rate=600r/m;
# Synced settings (server/synced-settings.mjs): the browser sends a change every few seconds at most.
limit_req_zone $banner_together_client_ip zone=openbanners_preferences:1m rate=30r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /_openbanners/passphrases/v1/preferences {
    limit_req zone=openbanners_preferences burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Overlay settings backup (server/overlay-backup.mjs) and "Download my data"
  # (server/data-export.mjs): same per-IP limit as the synced settings. The
  # one-time codes travel in the request body, never in the URL.
  location ^~ /_openbanners/passphrases/v1/overlay/ {
    limit_req zone=openbanners_preferences burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    client_max_body_size 48k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /_openbanners/passphrases/v1/export {
    limit_req zone=openbanners_preferences burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /_openbanners/passphrases/v1/ {
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # "Join on Telegram" (server/telegram-join.mjs). Only the Authorization
  # header goes through; no body, no cookies, no access log (the token is in
  # a header, never in the URL, but keep it quiet anyway).
  location ^~ /_openbanners/telegram/v1/ {
    access_log off;
    limit_req zone=banner_together_requests burst=30 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8791;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /_openbanners/banner-together/v3/health {
    access_log off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $openbanners_forwarded_proto;
    proxy_set_header X-Real-IP $banner_together_client_ip;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /_openbanners/banner-together/v3/rooms {
    access_log off;
    client_body_buffer_size 24k;
    client_max_body_size 24k;
    limit_req zone=banner_together_requests burst=120 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $openbanners_forwarded_proto;
    proxy_set_header X-Real-IP $banner_together_client_ip;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /_openbanners/banner-together/v2/ {
    access_log off;
    return 404;
  }

  location ^~ /_openbanners/banner-together/ {
    return 404;
  }

  location /api/ {
    return 404;
  }

  # PWA files: always revalidated, never the SPA shell when missing (a
  # service worker or manifest must not turn into HTML).
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    types { application/manifest+json json; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # The Android WebView app (OpenBanners.apk) was retired for "Install app"
  # (2026-10-27); old download links land on the site.
  location = /OpenBanners.apk {
    # Relative Location: the container itself only speaks http.
    absolute_redirect off;
    return 302 /;
  }

  # Every page load gets the SPA shell with its own link preview (title,
  # description, image) from server/banner-meta.mts + server/page-meta.mjs.
  location @banner_meta {
    add_header Cache-Control "no-cache" always;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_intercept_errors on;
    error_page 502 503 504 = /index.html;
  }

  location ~* \.(php[0-9]?|phtml|phar)(/|$) {
    return 404;
  }

  location / {
    # The SPA shell must be revalidated so a deploy shows up right away
    # (hashed /assets/ stay cached for a year).
    add_header Cache-Control "no-cache" always;
    try_files $uri @banner_meta;
  }
}
