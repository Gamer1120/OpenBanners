# Browser security headers for openbanners.org and test.openbanners.org.
# The VPS nginx (in front of the container) sends them on every answer: HTML,
# /assets/, the sign-in callback, /_openbanners/ services and 404s. Installed
# by hand, NOT by the Docker image/Watchtower deploy:
#   /etc/nginx/snippets/openbanners-security-headers.conf  (this file)
#   /etc/nginx/conf.d/openbanners-security-headers-map.conf (the map file)
# and included at server level of both vhosts plus in every location of
# docker/openbanners-nginx-container-location.conf (a location with its own
# add_header doesn't inherit the server's). After changing: copy, nginx -t,
# systemctl reload nginx.
#
# Content-Security-Policy: everything the site loads (checked 2026-10-30 by a
# full feature walk in headless Chrome with zero violations):
# - scripts only from the site itself: no inline <script> (index.html and
#   public/bannergress-auth-callback.html load files; src/indexHtml.test.js
#   checks), no eval;
# - inline styles: MUI/emotion <style> tags and Leaflet's style attributes;
# - images: Bannergress banner pictures (api.bannergress.com), mission
#   pictures (lh3.googleusercontent.com), OpenStreetMap tiles, data:/blob:;
# - fetch: the site's own services, the Bannergress API and its Keycloak token
#   endpoint (login.bannergress.com; sign-in itself is a popup navigation);
# - workers (rerouter) and the manifest/service worker from the site itself.
# Banner Together's WebRTC (STUN) is not governed by CSP.
# Adding a new external host to the app = add it here and on the VPS first.
# REPORT-ONLY PHASE (2026-10-30): enforce only frame-ancestors + upgrade-insecure-requests.
add_header Content-Security-Policy "frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.bannergress.com https://*.googleusercontent.com https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://api.bannergress.com https://login.bannergress.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options $openbanners_nosniff always;
add_header Referrer-Policy $openbanners_referrer_policy always;
add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), web-share=(self), camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), browsing-topics=()" always;
